<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Survival Skies</title>
<link rel="stylesheet" href="css/01-base.css">
<link rel="stylesheet" href="css/02-cutscenes.css">
<link rel="stylesheet" href="css/03-underground.css">
</head>
<body>
<div id="survival-skies-body"></div>
<script>
(async()=>{
  const target=document.getElementById('survival-skies-body');
  try{
    const response=await fetch('document/body.html', {cache:'no-store'});
    if(!response.ok) throw new Error('Could not load game body');

    // body.html is the original source body. It still contains its old
    // inline <script>, so remove those scripts before inserting the HTML.
    const source=await response.text();
    const parsed=new DOMParser().parseFromString(source,'text/html');
    parsed.querySelectorAll('script').forEach(s=>s.remove());
    target.outerHTML=parsed.body.innerHTML;

    const scripts=[
      'js/01-hud.js','js/02-input.js','js/03-game-state.js','js/04-player.js',
      'js/05-surface-level.js','js/06-underground-level.js','js/07-grapple-anchors.js',
      'js/08-tunnel-grapple-anchors.js','js/09-objects.js','js/10-components.js',
      'js/11-scrap.js','js/12-rain.js','js/13-particles.js','js/14-objectives.js',
      'js/15-dialogue.js','js/16-nearest-component.js','js/17-nearest-object.js',
      'js/18-nearest-tunnel-anchor.js','js/19-grapple.js','js/20-action.js',
      'js/21-tunnel-action.js','js/22-movement.js','js/23-checkpoint.js',
      'js/24-respawn.js','js/25-progression.js','js/26-tunnel-progression.js',
      'js/27-scrap-2.js','js/28-transmitter-cutscene.js','js/29-show-cutscene.js',
      'js/30-advance-cutscene.js','js/31-end-transmitter.js','js/32-cave-trap.js',
      'js/33-game-start.js'
    ];

    for(const src of scripts){
      await new Promise((resolve,reject)=>{
        const s=document.createElement('script');
        s.src=src;
        s.onload=resolve;
        s.onerror=()=>reject(new Error('Could not load '+src));
        document.body.appendChild(s);
      });
    }
  }catch(error){
    document.body.innerHTML='<pre style="padding:30px;color:#fff;background:#071116;font:16px system-ui">SURVIVAL SKIES FAILED TO LOAD\n\n'+error.message+'</pre>';
    console.error(error);
  }
})();
</script>
</body>
</html>
