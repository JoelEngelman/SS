name: Build modular Survival Skies source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SS
        uses: actions/checkout@v4

      - name: Generate modular source
        run: node tools/split-survival-skies.mjs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Generate modular Survival Skies source [skip ci]"
            git push
          fi
